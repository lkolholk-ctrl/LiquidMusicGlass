name: APK Smoke Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ hashFiles('.github/workflows/smoke-test.yml') }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== Smoke Test Started ==="
            
            # Wait for boot
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
              echo -n "."
              sleep 2
            done
            echo "Boot completed!"
            sleep 5
            
            # Install APK
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            echo "Installing $APK_PATH..."
            adb install -r -t "$APK_PATH"
            echo "APK installed."
            
            # Clear logcat
            adb logcat -c
            
            # Launch app
            echo "Launching MainActivity..."
            adb shell am start -n "com.glassfiles.liquidmusicglass/com.glassfiles.liquidmusicglass.MainActivity"
            sleep 5
            
            # Screenshot
            echo "Taking screenshot..."
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png smoke-test-screenshot.png
            adb shell rm /sdcard/screen.png
            
            # Collect logcat
            echo "Collecting logcat..."
            adb logcat -d > smoke-test-logcat.txt
            
            # Check for crashes
            echo "=== Crash Analysis ==="
            CRASH=0
            if grep -q "FATAL EXCEPTION" smoke-test-logcat.txt; then
              echo "❌ FATAL EXCEPTION found!"
              grep -A 10 "FATAL EXCEPTION" smoke-test-logcat.txt
              CRASH=1
            fi
            
            if grep -q "UninitializedPropertyAccessException" smoke-test-logcat.txt; then
              echo "❌ UninitializedPropertyAccessException found!"
              grep -A 10 "UninitializedPropertyAccessException" smoke-test-logcat.txt
              CRASH=1
            fi
            
            if [ $CRASH -eq 0 ]; then
              echo "✅ No crashes detected — SMOKE TEST PASSED"
            else
              echo "❌ SMOKE TEST FAILED"
              exit 1
            fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            smoke-test-screenshot.png
            smoke-test-logcat.txt
          retention-days: 7
