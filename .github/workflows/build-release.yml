name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK r26d, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "Release keystore decoded."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set — the release APK will be UNSIGNED."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch forked media3 (crossfade) AARs
        run: |
          VER=1.5.1-lmg2
          curl -sSL -o media3-m2.zip \
            "https://github.com/lkolholk-ctrl/media3-lmg/releases/download/v${VER}/media3-${VER}-m2.zip"
          mkdir -p media3-m2
          unzip -q media3-m2.zip -d media3-m2
          echo "media3 fork AARs: $(find media3-m2 -name '*.aar' | wc -l)"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="release-${SAFE}"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="LiquidMusicGlass-${SAFE}.apk"
          cp "$APK" "$OUT"
          echo "Built: $APK -> $OUT"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release build · ${GITHUB_REF_NAME}" \
              --notes "Automated release build from ${GITHUB_SHA}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
          gh release edit "$TAG" \
            --title "Release build · ${GITHUB_REF_NAME}" \
            --notes "Automated release build from ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"
          gh release upload "$TAG" "$OUT" --clobber
          echo "APK published to release '$TAG'."
