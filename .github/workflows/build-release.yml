name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK r26d, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "Release keystore decoded."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set — the release APK will be UNSIGNED."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # O-MVLL (этап 2, #83): плагин под NDK r26d + smoke-тест перед включением.
      # Любой сбой → сборка без обфускации, APK всегда собирается. Шаг exit 0.
      - name: Prepare O-MVLL (NDK r26d, smoke-tested, best-effort)
        run: |
          set -u
          URL="https://github.com/open-obfuscator/o-mvll/releases/download/1.4.0/omvll_v1-4-0_linux_2025-09-26T07.18.59.tar.gz"
          DIR="$GITHUB_WORKSPACE/omvll"
          CONFIG="$GITHUB_WORKSPACE/app/src/main/cpp/omvll_config.py"
          mkdir -p "$DIR"
          if ! curl -fsSL -o /tmp/omvll.tgz "$URL"; then
            echo "::warning::O-MVLL download failed — building without obfuscation"; exit 0
          fi
          tar xzf /tmp/omvll.tgz -C "$DIR" || { echo "::warning::O-MVLL extract failed — plain build"; exit 0; }
          PLUGIN="$(find "$DIR" \( -name 'libOMVLL*.so' -o -name 'omvll*.so' \) | head -n1)"
          if [ -z "$PLUGIN" ]; then echo "::warning::O-MVLL plugin .so not found — plain build"; exit 0; fi
          echo "O-MVLL tarball layout:"; find "$DIR" -maxdepth 3 | sed 's/^/  /' | head -60
          # Встроенному CPython нужен его stdlib: ищем каталог с encodings/ (или
          # zip). Мимо этого падало «ModuleNotFoundError: No module named encodings».
          STDLIB="$(find "$DIR" -type d -name encodings 2>/dev/null | head -n1)"
          if [ -n "$STDLIB" ]; then
            PYHOME="$(dirname "$STDLIB")"
          else
            ZIP="$(find "$DIR" -name 'python3*.zip' 2>/dev/null | head -n1)"
            PYHOME="${ZIP:-$(dirname "$PLUGIN")}"
          fi
          echo "O-MVLL PYHOME=$PYHOME"
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          if [ ! -x "$CLANG" ]; then echo "::warning::NDK clang not found at $CLANG — plain build"; exit 0; fi
          printf 'int lmg_smoke(int x){const char*s="probe";return x*3+(int)s[0];}\n' > /tmp/smoke.c
          if OMVLL_CONFIG="$CONFIG" OMVLL_PYTHONPATH="$PYHOME" \
               "$CLANG" -c -fpass-plugin="$PLUGIN" /tmp/smoke.c -o /tmp/smoke.o 2> /tmp/smoke.log; then
            echo "O-MVLL smoke test PASSED — enabling obfuscation for lmg_resolve"
            echo "OMVLL_PLUGIN=$PLUGIN"       >> "$GITHUB_ENV"
            echo "OMVLL_CONFIG=$CONFIG"       >> "$GITHUB_ENV"
            echo "OMVLL_PYTHONPATH=$PYHOME"   >> "$GITHUB_ENV"
          else
            echo "::warning::O-MVLL smoke test FAILED — building without obfuscation. Log:"
            sed 's/^/  /' /tmp/smoke.log || true
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="release-${SAFE}"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="LiquidMusicGlass-${SAFE}.apk"
          cp "$APK" "$OUT"
          echo "Built: $APK -> $OUT"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release build · ${GITHUB_REF_NAME}" \
              --notes "Automated release build from ${GITHUB_SHA}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
          gh release edit "$TAG" \
            --title "Release build · ${GITHUB_REF_NAME}" \
            --notes "Automated release build from ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"
          gh release upload "$TAG" "$OUT" --clobber
          echo "APK published to release '$TAG'."
