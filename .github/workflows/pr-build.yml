name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Write local.properties with API key
        env:
          ICM_API_KEY: ${{ secrets.ICM_API_KEY }}
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          # Fall back to a placeholder so the build doesn't fail when secrets
          # are unavailable to forked PRs. Runtime calls will obviously fail
          # without a real key, but compilation succeeds.
          if [ -z "$ICM_API_KEY" ]; then
            echo "ICM_API_KEY=pk_pr_build_placeholder" >> local.properties
          else
            echo "ICM_API_KEY=$ICM_API_KEY" >> local.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile debug
        run: ./gradlew assembleDebug --stacktrace
