name: CI

# Builds a signed RELEASE APK on every branch push (except the release
# branches handled by build-release.yml) and publishes it to a per-branch
# GitHub Release, so it can be downloaded and tested directly without
# touching the (limited) Actions artifact storage.
on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed for the gh CLI to create/update Releases with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Test
    # GitHub-hosted runner ships a base Android SDK and ANDROID_HOME; the
    # self-hosted runner has no SDK configured (the cause of the previous
    # "SDK location not found" failures).
    # ubuntu-latest. Проверено: и на 24.04, и на 22.04 пасс AntiHook из O-MVLL
    # 1.4.x одинаково роняет clang (exit 139) — т.е. дело не в версии Ubuntu, а
    # в среде хостед-раннера (похоже на харднинг JIT/исполняемой памяти); у
    # автора заводилось на СВОЁМ сервере. Значит смена версии Ubuntu не лечит —
    # оставляем latest (быстрее провижнится), smoke-гейт держит APK зелёным.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Persist Gradle caches (downloaded deps + build-cache task outputs)
      # across runs so subsequent builds don't recompile/redownload from
      # scratch. Key invalidates when build scripts change.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK r26d, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "Release keystore decoded."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set — the release APK will be UNSIGNED."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --stacktrace

      # Publish the APK first so it is always delivered even if a later
      # step (e.g. tests) fails.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="ci-${SAFE}"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="LiquidMusicGlass-${SAFE}.apk"
          cp "$APK" "$OUT"
          echo "Built: $APK -> $OUT"

          # Create the rolling per-branch pre-release if it does not exist yet,
          # then upload the APK, overwriting any previous asset.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "CI build · ${GITHUB_REF_NAME}" \
              --notes "Automated CI build from ${GITHUB_SHA}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" "$OUT" --clobber
          echo "APK published to release '$TAG'."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --build-cache --stacktrace
