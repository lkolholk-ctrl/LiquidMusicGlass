name: CI

# Builds a signed RELEASE APK and runs unit tests on every branch push
# (except the release branches handled by build-release.yml) and on PRs,
# so the artifact can be installed and tested directly.
on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK & Test
    # GitHub-hosted runner ships a base Android SDK and ANDROID_HOME; the
    # self-hosted runner has no SDK configured (the cause of the previous
    # "SDK location not found" failures).
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK r26d, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "Release keystore decoded."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set — the release APK will be UNSIGNED."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidMusicGlass-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 5
          overwrite: true

      # Test reports only when something failed, to keep artifact storage low.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 3
          overwrite: true
