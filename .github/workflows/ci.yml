name: CI

# Builds a signed RELEASE APK on every branch push (except the release
# branches handled by build-release.yml) and publishes it to a per-branch
# GitHub Release, so it can be downloaded and tested directly without
# touching the (limited) Actions artifact storage.
on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed for the gh CLI to create/update Releases with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Test
    # GitHub-hosted runner ships a base Android SDK and ANDROID_HOME; the
    # self-hosted runner has no SDK configured (the cause of the previous
    # "SDK location not found" failures).
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Persist Gradle caches (downloaded deps + build-cache task outputs)
      # across runs so subsequent builds don't recompile/redownload from
      # scratch. Key invalidates when build scripts change.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK r26d, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release-key.jks"
            echo "Release keystore decoded."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set — the release APK will be UNSIGNED."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # O-MVLL (этап 2, #83): качаем LLVM-плагин под NDK r26d, СНАЧАЛА гоняем
      # smoke-тест на тривиальном файле тем же NDK-clang. Только если он прошёл —
      # экспортируем env, и сборка обфусцирует резолвер. Любой сбой (нет сети,
      # не тот формат, плагин падает) → env не выставлен → APK собирается без
      # обфускации. Шаг НИКОГДА не валит джобу (всегда exit 0).
      - name: Prepare O-MVLL (NDK r26d, smoke-tested, best-effort)
        run: |
          set -u
          DIR="$GITHUB_WORKSPACE/omvll"
          CONFIG="$GITHUB_WORKSPACE/app/src/main/cpp/omvll_config.py"
          mkdir -p "$DIR"
          # Берём САМЫЙ СВЕЖИЙ ассет линии 1.4.x (NDK r26d / LLVM 17 — под наш
          # тулчейн; 1.5+ уже на r27/LLVM18, который у нас не заводится). Через
          # GitHub API, чтобы не хардкодить таймстамп в имени; если API/сеть
          # подведут — падаем на зашитый 1.4.0.
          FALLBACK="https://github.com/open-obfuscator/o-mvll/releases/download/1.4.0/omvll_v1-4-0_linux_2025-09-26T07.18.59.tar.gz"
          URL="$(curl -fsSL "https://api.github.com/repos/open-obfuscator/o-mvll/releases?per_page=50" 2>/dev/null | python3 -c 'import sys,json,re; d=json.load(sys.stdin); c=[(int(m.group(1)),a["browser_download_url"]) for r in d for a in r.get("assets",[]) if (m:=re.search(r"omvll_v1-4-(\d+)_linux_.*\.tar\.gz$", a.get("name","")))]; c.sort(); print(c[-1][1] if c else "")' 2>/dev/null)"
          [ -z "$URL" ] && URL="$FALLBACK"
          echo "O-MVLL asset: $URL"
          if ! curl -fsSL -o /tmp/omvll.tgz "$URL"; then
            echo "::warning::O-MVLL download failed — building without obfuscation"; exit 0
          fi
          tar xzf /tmp/omvll.tgz -C "$DIR" || { echo "::warning::O-MVLL extract failed — plain build"; exit 0; }
          PLUGIN="$(find "$DIR" \( -name 'libOMVLL*.so' -o -name 'omvll*.so' \) | head -n1)"
          if [ -z "$PLUGIN" ]; then echo "::warning::O-MVLL plugin .so not found — plain build"; exit 0; fi
          echo "O-MVLL tarball layout:"; find "$DIR" -maxdepth 3 | sed 's/^/  /' | head -60
          # Встроенному CPython нужен его stdlib: ищем каталог с encodings/ (или
          # zip). Мимо этого падало «ModuleNotFoundError: No module named encodings».
          STDLIB="$(find "$DIR" -type d -name encodings 2>/dev/null | head -n1)"
          if [ -n "$STDLIB" ]; then
            PYHOME="$(dirname "$STDLIB")"
          else
            ZIP="$(find "$DIR" -name 'python3*.zip' 2>/dev/null | head -n1)"
            PYHOME="${ZIP:-$(dirname "$PLUGIN")}"
          fi
          echo "O-MVLL PYHOME=$PYHOME"
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          if [ ! -x "$CLANG" ]; then echo "::warning::NDK clang not found at $CLANG — plain build"; exit 0; fi
          # Smoke компилируем ТЕМИ ЖЕ флагами, что и реальный резолвер
          # (C++ / -Oz / -fPIC): пасс AntiHook в 1.4.0 гоняется по модулю
          # безусловно и падал segfault'ом на голом C при -O0. Если он
          # свалится и здесь — значит свалит и настоящую сборку, поэтому
          # smoke должен быть верным её слепком, а не однострочником.
          printf '%s\n' \
            '#include <string.h>' \
            '__attribute__((visibility("default")))' \
            'int lmg_probe(const char* in, char* out, int n){' \
            '  static const char* K="abcdefABCDEF0123456789";' \
            '  int acc=0;' \
            '  for(int i=0;i<n && in[i];i++){ char c=in[i]^K[i%22]; out[i]=c; acc=(acc*131+(unsigned char)c)&0x7fffffff; }' \
            '  if(acc==0) acc=(int)strlen(K);' \
            '  return acc;' \
            '}' > /tmp/smoke.c
          if OMVLL_CONFIG="$CONFIG" OMVLL_PYTHONPATH="$PYHOME" \
               "$CLANG" -c -Oz -fPIC -std=c++17 -x c++ -fpass-plugin="$PLUGIN" /tmp/smoke.c -o /tmp/smoke.o 2> /tmp/smoke.log; then
            echo "O-MVLL smoke test PASSED — enabling obfuscation for lmg_resolve"
            echo "OMVLL_PLUGIN=$PLUGIN"       >> "$GITHUB_ENV"
            echo "OMVLL_CONFIG=$CONFIG"       >> "$GITHUB_ENV"
            echo "OMVLL_PYTHONPATH=$PYHOME"   >> "$GITHUB_ENV"
          else
            echo "::warning::O-MVLL smoke test FAILED — building without obfuscation. Log:"
            sed 's/^/  /' /tmp/smoke.log || true
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --stacktrace

      # Publish the APK first so it is always delivered even if a later
      # step (e.g. tests) fails.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="ci-${SAFE}"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          OUT="LiquidMusicGlass-${SAFE}.apk"
          cp "$APK" "$OUT"
          echo "Built: $APK -> $OUT"

          # Create the rolling per-branch pre-release if it does not exist yet,
          # then upload the APK, overwriting any previous asset.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "CI build · ${GITHUB_REF_NAME}" \
              --notes "Automated CI build from ${GITHUB_SHA}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" "$OUT" --clobber
          echo "APK published to release '$TAG'."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --build-cache --stacktrace
